name: Main Validation

# Asynchronous main evidence; daily pushes do not wait on this run, while formal
# release evidence may bind to a successful run through the release chain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
      risk: ${{ steps.scope.outputs.risk }}
      run_root: ${{ steps.scope.outputs.run_root }}
      run_desktop: ${{ steps.scope.outputs.run_desktop }}
      run_docx: ${{ steps.scope.outputs.run_docx }}
      run_agent: ${{ steps.scope.outputs.run_agent }}
      run_webui: ${{ steps.scope.outputs.run_webui }}
      run_linux_packaging: ${{ steps.scope.outputs.run_linux_packaging }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="${BEFORE:-}"
          case "$EVENT_NAME" in
            push)
              if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                echo "push event requires a non-empty, non-zero, resolvable github.event.before" >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              if ! base="$(git rev-parse --verify "$HEAD_SHA^" 2>/dev/null)"; then
                echo "workflow_dispatch requires a resolvable HEAD^ comparison base" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported event for change classification: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          python3 scripts/classify-ci-scope.py \
            --base "$base" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  baseline:
    name: Baseline integrity
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate classifier and patch
        run: |
          python -m unittest tests.test_ci_scope_classifier
          git diff --check "${{ needs.classify.outputs.base }}...${{ needs.classify.outputs.head }}"

  linux_packaging:
    name: Linux packaging contracts
    needs: classify
    if: needs.classify.outputs.run_linux_packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate Linux packaging shell entrypoints
        run: |
          bash -n \
            packaging/linux/deb/preinst \
            packaging/linux/deb/postinst \
            packaging/linux/deb/prerm \
            packaging/linux/deb/postrm \
            packaging/linux/deb/publish-single-deb.sh \
            packaging/linux/bin/taiji-agent-acceptance \
            scripts/sign-taiji-release-evidence.sh \
            scripts/taiji-release-check.sh \
            taijiagent\ 打包交付/00_制包机_生成离线交付包.sh \
            taijiagent\ 打包交付/01_制包机_发布预检.sh \
            taijiagent\ 打包交付/02_目标终端_安装并验证.sh \
            taijiagent\ 打包交付/04_目标终端_桌面App验收并导出证据.sh
      - name: Run unified DEB contract tests
        run: |
          python -m unittest -v \
            tests.test_linux_compatibility_policy \
            tests.test_compatibility_policy_preinst \
            tests.test_linux_elf_abi_closure \
            tests.test_unified_deb_build_contract \
            tests.test_acceptance_tools_integrity \
            tests.test_installed_acceptance_trust_anchor \
            tests.test_certification_matrix_contract \
            tests.test_certification_set_v1 \
            tests.test_environment_evidence_v2_contract \
            tests.test_github_ci_evidence_producer \
            tests.test_linux_desktop_packaging_static \
            tests.test_linux_electron_runtime_staging \
            tests.test_negative_boundary_evidence_producer \
            tests.test_offline_rehearsal_producer \
            tests.test_release_evidence_assembler_v3 \
            tests.test_release_evidence_schema_v3 \
            tests.test_release_check_v3 \
            tests.test_single_deb_publisher_gate \
            tests.test_single_deb_sales_contract \
            tests.test_strict_build_toolchain_contract \
            tests.test_target_desktop_acceptance_producer \
            tests.test_target_evidence_v2_contract
      - name: Run installed Electron acceptance evidence contracts
        run: |
          node --test tools/taiji-desktop-acceptance/run-installed-electron-acceptance.test.js
          python -B tools/taiji-desktop-acceptance/test_assemble_target_evidence.py
          python -B tools/taiji-desktop-acceptance/test_observe_single_deb_install.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8'
      - name: Execute Kylin Python 3.8 packaging compatibility gate
        run: python tests/python38_linux_packaging_gate.py
      - name: Check packaging diff
        run: git diff --check

  root:
    name: Root contracts
    needs: classify
    if: needs.classify.outputs.run_root == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: hermes-local-lab/sources/hermes-agent/uv.lock
      - name: Install the uv-managed standalone Python required by packaging tests
        run: uv python install 3.11
      - name: Prepare the canonical Agent venv required by root contracts
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/taiji-root-venv
        working-directory: hermes-local-lab/sources/hermes-agent
        run: uv sync --locked --python 3.11 --extra dev --extra messaging
      - name: Run Taiji root contracts with uv-managed Python
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/taiji-root-venv
          TAIJI_AGENT_PYTHON: ${{ runner.temp }}/taiji-root-venv/bin/python
        run: >-
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m unittest discover -s tests -p 'test_*.py'

  desktop:
    name: Desktop shell
    needs: classify
    if: needs.classify.outputs.run_desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/taiji-desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/taiji-desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node --test tests/*.test.js

  docx:
    name: DOCX engine
    needs: classify
    if: needs.classify.outputs.run_docx == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-local-lab/sources/docx-engine-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermes-local-lab/sources/docx-engine-v2/package-lock.json
      - run: npm ci
      - name: Materialize locked Linux native packages for portable skill tests
        run: node scripts/materialize-portable-resvg-dependencies.js
      - run: npm test

  agent:
    name: Agent focused regression
    needs: classify
    if: needs.classify.outputs.run_agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-local-lab/sources/hermes-agent
    env:
      UV_PROJECT_ENVIRONMENT: venv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: hermes-local-lab/sources/hermes-agent/uv.lock
      - run: uv sync --locked --extra dev --extra messaging
      - name: Run Taiji agent contracts through canonical runner
        run: |
          scripts/run_tests.sh \
            tests/tools/test_taiji_security_mode.py \
            tests/test_taiji_license.py \
            tests/gateway/test_api_server_license.py \
            tests/gateway/test_session_api.py \
            tests/tools/test_image_generation_readiness.py

  webui:
    name: WebUI focused regression
    needs: classify
    if: needs.classify.outputs.run_webui == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: venv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: hermes-local-lab/sources/hermes-agent/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermes-local-lab/sources/hermes-webui/package-lock.json
      - name: Prepare shared Agent Python environment
        working-directory: hermes-local-lab/sources/hermes-agent
        run: uv sync --locked --extra dev
      - name: Install WebUI dependencies into Agent environment
        working-directory: hermes-local-lab/sources/hermes-webui
        run: uv pip install --python ../hermes-agent/venv/bin/python -r requirements.txt
      - name: Install JavaScript lint dependencies
        working-directory: hermes-local-lab/sources/hermes-webui
        run: npm ci
      - name: Run WebUI runtime lint and focused regression
        working-directory: hermes-local-lab/sources/hermes-webui
        run: |
          npm run lint:runtime
          ../hermes-agent/venv/bin/python -m pytest -q \
            tests/test_brand_privacy.py \
            tests/test_model_config_api.py \
            tests/test_model_config_frontend.py \
            tests/test_approval_queue.py \
            tests/test_approval_sse.py \
            tests/test_pr1350_sse_notify_correctness.py \
            tests/test_expert_team_frontend.py \
            tests/test_expert_team_frontend_v2.py \
            tests/test_expert_team_frontend_v3.py \
            tests/test_managed_dialog_static.py \
            tests/test_onboarding_static.py \
            tests/test_ui_visibility_config.py \
            tests/test_issue1800_file_html_interactions.py \
            tests/test_writeflow_frontend.py::test_taiji_shell_breakpoint_keeps_electron_1024_in_desktop_shell \
            tests/test_issue1116_composer_placeholder.py

  ci-gate:
    name: CI Gate
    if: always()
    needs: [classify, baseline, linux_packaging, root, desktop, docx, agent, webui]
    runs-on: ubuntu-latest
    env:
      CLASSIFY: ${{ needs.classify.result }}
      BASELINE: ${{ needs.baseline.result }}
      ROOT: ${{ needs.root.result }}
      DESKTOP: ${{ needs.desktop.result }}
      DOCX: ${{ needs.docx.result }}
      AGENT: ${{ needs.agent.result }}
      WEBUI: ${{ needs.webui.result }}
      LINUX_PACKAGING: ${{ needs.linux_packaging.result }}
      RUN_ROOT: ${{ needs.classify.outputs.run_root }}
      RUN_DESKTOP: ${{ needs.classify.outputs.run_desktop }}
      RUN_DOCX: ${{ needs.classify.outputs.run_docx }}
      RUN_AGENT: ${{ needs.classify.outputs.run_agent }}
      RUN_WEBUI: ${{ needs.classify.outputs.run_webui }}
      RUN_LINUX_PACKAGING: ${{ needs.classify.outputs.run_linux_packaging }}
    steps:
      - name: Require every selected job to pass
        run: |
          python3 - <<'PY'
          import os
          required = {"CLASSIFY", "BASELINE"}
          failed = []
          for name in ("CLASSIFY", "BASELINE", "LINUX_PACKAGING", "ROOT", "DESKTOP", "DOCX", "AGENT", "WEBUI"):
              result = os.environ[name]
              selected = name in required or os.environ.get(f"RUN_{name}") == "true"
              if selected and result != "success":
                  failed.append(f"{name}={result}")
          if failed:
              raise SystemExit("CI gate failed: " + ", ".join(failed))
          print("CI gate passed")
          PY
